<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyPulse | Modern Weather Dashboard</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <div class="app-container">
    <!-- Header: App branding and Search -->
    <header class="dashboard-header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
        </svg>
        <span>SkyPulse</span>
      </div>

      <form id="search-form" class="search-form" autocomplete="off">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input 
            type="text" 
            id="city-input" 
            placeholder="Search city (e.g., Delhi, Tokyo, London)..." 
            required
            aria-label="Search city"
          />
        </div>
        <button type="submit" class="btn btn-search">Search</button>
        <button type="button" id="geo-btn" class="btn btn-geo" title="Use current location" aria-label="Use current location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="3 11 22 2 13 21 11 13 3 11"/>
          </svg>
        </button>
      </form>
    </header>

    <!-- Notification / Error Banner -->
    <div id="status-message" class="status-message hidden" role="alert"></div>

    <!-- Main Content Grid -->
    <main class="dashboard-grid">
      <!-- Loading Skeleton / Spinner Overlay -->
      <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>Fetching weather forecast...</p>
      </div>

      <!-- Current Weather Hero Card -->
      <section class="card current-weather-card" id="current-weather">
        <div class="card-header">
          <div>
            <h1 class="city-name" id="city-name">--</h1>
            <p class="current-date" id="current-date">--</p>
          </div>
          <span class="badge" id="timezone-badge">UTC</span>
        </div>

        <div class="weather-primary">
          <div class="temperature-group">
            <span class="current-temp" id="current-temp">--</span>
            <span class="temp-unit">°C</span>
          </div>
          <div class="weather-condition-display">
            <div class="weather-icon-large" id="current-weather-icon">
              <!-- Dynamically populated SVG -->
            </div>
            <p class="weather-desc" id="weather-desc">Loading...</p>
          </div>
        </div>

        <div class="daily-minmax">
          <span class="minmax-item">High: <strong id="today-high">--°C</strong></span>
          <span class="minmax-item">Low: <strong id="today-low">--°C</strong></span>
          <span class="minmax-item">Feels like: <strong id="feels-like">--°C</strong></span>
        </div>
      </section>

      <!-- Highlights Section (Humidity, Wind Speed, etc.) -->
      <section class="highlights-section">
        <h2 class="section-title">Today's Highlights</h2>
        <div class="highlights-grid">
          <!-- Humidity Card -->
          <div class="card highlight-card">
            <div class="highlight-header">
              <span class="highlight-label">Humidity</span>
              <svg class="highlight-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
              </svg>
            </div>
            <div class="highlight-body">
              <span class="highlight-value" id="humidity-value">--</span>
              <span class="highlight-unit">%</span>
            </div>
            <p class="highlight-subtext" id="humidity-level">Normal range</p>
          </div>

          <!-- Wind Speed Card -->
          <div class="card highlight-card">
            <div class="highlight-header">
              <span class="highlight-label">Wind Speed</span>
              <svg class="highlight-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
              </svg>
            </div>
            <div class="highlight-body">
              <span class="highlight-value" id="wind-value">--</span>
              <span class="highlight-unit">km/h</span>
            </div>
            <p class="highlight-subtext" id="wind-level">Gentle breeze</p>
          </div>
        </div>
      </section>

      <!-- 5-Day Forecast Section -->
      <section class="forecast-section">
        <h2 class="section-title">5-Day Forecast</h2>
        <div class="forecast-grid" id="forecast-container">
          <!-- Forecast cards will be dynamically injected here via JavaScript -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="dashboard-footer">
      <p>Data provided by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> (No API Key Required). Designed for learners.</p>
    </footer>
  </div>

  <!-- JavaScript Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
